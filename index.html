<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light py-5">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7">
                <div class="card shadow border-0 rounded-4">

                    <div class="card-header bg-dark text-white text-center py-4 rounded-top-4">
                        <h2 class="fw-bold mb-0"><i class="bi bi-check2-square me-2 text-warning"></i>Todo List</h2>
                        <p class="mb-0 small text-white-50">Manage your daily tasks efficiently</p>
                    </div>

                    <div class="card-body p-4 p-sm-5">

                        <div id="validationAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                            <span id="alertText"></span>
                            <button type="button" class="btn-close" onclick="closeAlert()"></button>
                        </div>

                        <form id="todoForm" class="row g-2 mb-4">
                            <div class="col-sm-9">
                                <input type="text" id="taskInput" class="form-control form-control-lg" placeholder="What needs to be done today?" maxlength="100">
                            </div>
                            <div class="col-sm-3">
                                <button type="submit" id="submitBtn" class="btn btn-dark btn-lg w-100 fw-bold">
                                <i class="bi bi-plus-circle-fill me-1"></i>Add
                            </button>
                            </div>
                        </form>

                        <div class="row g-2 align-items-center mb-4 pb-3 border-bottom">
                            <div class="col-12 col-sm-6">
                                <div class="btn-group w-100" role="group">
                                    <button type="button" id="filterAll" class="btn btn-outline-dark active fw-bold small" onclick="setFilter('all')">All</button>
                                    <button type="button" id="filterPending" class="btn btn-outline-dark fw-bold small" onclick="setFilter('pending')">Pending</button>
                                    <button type="button" id="filterCompleted" class="btn btn-outline-dark fw-bold small" onclick="setFilter('completed')">Completed</button>
                                </div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                                    <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Search tasks..." oninput="handleSearch()">
                                </div>
                            </div>
                        </div>

                        <section>
                            <ul id="todoList" class="list-group gap-2"></ul>

                            <div id="emptyView" class="text-center py-5 text-muted d-none">
                                <i class="bi bi-clipboard-x display-4 d-block mb-2"></i>
                                <p class="mb-0 fw-semibold">No tasks found matching current filters.</p>
                            </div>
                        </section>

                    </div>

                    <div class="card-footer bg-white py-3 border-top text-center rounded-bottom-4 text-muted small">
                        Data is temporarily persisted using browser LocalStorage.
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
